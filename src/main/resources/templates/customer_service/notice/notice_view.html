<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} ?: 'NICHIYA'">NICHIYA</title>
    <link rel="icon" th:href="@{/favicon.ico}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
</head>
<body>

    <style>
        html{ scrollbar-gutter: stable; }
        .icon-btn {
            background:none; border:1px solid #000; cursor:pointer;
            width:40px; height:40px; display:grid; place-items:center;
        }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            font-size: 14px;
            color: #333;
            line-height: 1.5;
            background-color: #f8f8f8;  /* 리스트와 동일하게 */
            margin:0;
        }
        #wrap {
            width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* 1) 스크림(배경) - 화면 전체 덮음 + 블러 */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(255,255,255,0.28);      /* 반투명이어야 blur 보임 */
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px); /* 사파리용 */
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
            z-index: 1000;
        }
        .overlay.open { opacity: 1; pointer-events: auto; }

        /* 2) 왼쪽에서 나오는 패널 */
        .overlay__panel {
            position: absolute; top:0; left:0;
            width: 50vw;                 /* 화면 절반 */
            max-width: 900px;            /*(선택) 최대 폭 제한 */
            height: 100%;
            background: white;         /* 패널 자체는 불투명해도 OK */
            transform: translateX(-100%); /* 화면 밖에서 시작 */
            transition: transform .35s ease;
            will-change: transform;
            display: flex; flex-direction: column;
        }
        .overlay.open .overlay__panel { transform: translateX(0); }

        /* 상단 닫기 버튼과 로고 영역 */
        .overlay__top {
            display:flex; align-items:center; gap:24px;
            padding:20px;
        }
        .overlay__close {
            background:none; border:1px solid; width:100px; height:50px; cursor:pointer;
            position:relative;
            border:none;
            margin-left:0.3%;
        }
        .overlay__close::before,
        .overlay__close::after{
            content:""; position:absolute; left:15px; right:10px; top:25px; height:2px; background:#000;
        }
        .overlay__close::before{ transform:rotate(45deg); }
        .overlay__close::after { transform:rotate(-45deg); }

        /* 메뉴 그리드 */
        .overlay__menu {
            display:grid; grid-template-columns: 180px auto; gap:24px;
            padding:40px 20px; font-size:16px;
        }
        .overlay__menu a {
            text-decoration:none; color:#000; display:block; padding:8px 0;
        }
        .overlay__menu strong { font-weight:700; }

        /* Header Sticky 및 background 적용 */
        :root{
            --glass-bg: rgba(255,255,255,.55); /* 호버 시 배경 투명도 */
            --glass-blur: 8px;                 /* 블러 정도 */
        }
        *{ box-sizing: border-box; }
        a{ color:inherit; text-decoration:none; }
        ul{ margin:0; padding:0; list-style:none; }

        /* ===== 헤더 (처음엔 투명, hover 시 반투명) ===== */
        .site-header{
            top: 0;
            z-index: 900;          /* 오버레이(1000)보다 낮게 */
        }
        .site-header::before{
            content:"";
            position:absolute; inset:0;
            background: rgba(255,255,255,0);            /* 기본 완전 투명 */
            transition: background 0.4s ease;
            z-index: -1;
            pointer-events: none;                        /* 클릭 방해 금지 */
        }
        .site-header:hover::before{
            background: rgba(255,255,255,0.7);                /* 마우스 올리면 반투명 */
        }
        .site-header .inner{
            position: relative; z-index: 1;             /* ::before 아래로 깔리게 */
            display:flex; align-items:center; gap:24px;
            padding: 16px 24px;
            border-bottom: 1px solid #000;              /* 필요 없으면 제거 */
        }
        .title-didone{
            text-align:center;
            font-family: 'Bodoni Moda','Didot','Bodoni 72','Times New Roman',serif;
            margin-left:45px;
            font-weight:400;
            letter-spacing:.02em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .title-didone.ko{font-family: 'Noto Serif KR','Bodoni Moda',serif; font-weight:300;}

        /* ================================
           📄 공지사항 상세 페이지 전용 스타일 추가
           (기존 주석 유지, 아래만 새로 추가)
        ================================= */
        #wrap {
            padding: 40px;
        }

        h1 {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #000;
        }

        .breadcrumb {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
        }

        /* 상단 탭 */
        /* ✅ notice_list.html과 동일하게 맞춤 */
        .cs_sub_nav {
            width: 100%;
            background-color: #f1f1f1;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }

        .cs_sub_nav ul {
            display: flex;
            padding: 0;
            margin: 0;
            list-style: none;
            width: 100%;
        }

        .cs_sub_nav ul li {
            flex: 1; /* 각 항목을 동일한 너비로 배분 */
            text-align: center;
            border-right: 1px solid #ddd;
        }

        .cs_sub_nav ul li:last-child {
            border-right: none;
        }

        .cs_sub_nav ul li a {
            display: block;
            padding: 15px 0;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            background-color: #fff;
            transition: background-color 0.2s, color 0.2s;
        }

        /* 활성 탭 / hover 시 스타일 */
        .cs_sub_nav ul li.on a,
        .cs_sub_nav ul li a:hover {
            background-color: gray;
            color: white;
        }

        /* 본문 */
        .title_area {
            border-top: 3px solid #ddd;
            border-bottom: 1px solid #ddd;
            padding: 20px 10px;
            margin-bottom: 30px;
        }
        .title_area h3 {
            font-size: 20px;
            margin: 0 0 10px 0;
        }
        .title_area .date {
            font-size: 13px;
            color: #999;
        }

        .view_area {
            min-height: 200px;
            padding: 10px;
            line-height: 1.7;
        }

        /* 버튼 */
        .btn_area {
            text-align: center;
            margin-top: 40px;
        }
        .btn_list {
            display: inline-block;
            background-color: #000;
            color: #fff;
            padding: 10px 25px;
            border-radius: 4px;
            text-decoration: none;
            transition: background .25s ease;
        }
        .btn_list:hover {
            background-color: #333;
        }

        #content.cs_notice_view_wrap {
            padding: 30px;
        }
    </style>

    <header th:replace="~{main/header :: header}">
        <div style="margin-left:2%; width:98%; box-sizing: border-box; margin-top:2%; display:flex; height:230px;">
            <button style="border:none;" id="menuBtn" class="icon-btn" aria-controls="menuOverlay" aria-expanded="false" aria-label="메뉴 열기">
                <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <rect y="12" width="64" height="1" fill="black"/>
                    <rect y="30" width="64" height="1" fill="black"/>
                    <rect y="48" width="64" height="1" fill="black"/>
                </svg>
            </button>
            <div style="margin-left:3%;">
                <img src="/images/logo.png" alt="" style="width:270px;">
            </div>
            <div style="margin-top:27px; margin-left:auto; margin-right:3%; flex:1; max-width:30%;">
                <ul style="list-style-type: none; padding: 0; margin:0; display:flex; gap:40px;">
                    <li style="flex:1; min-width: 100px;">
                        <form action="" method="" style="width:100%;">
                            <input type="text" style="background: transparent;border:none; border-bottom:1px solid; padding-bottom:10px; width:80%;" value="검색"
                            onfocus="this.style.outline='none';"
                            onblur="this.style.outline='none';">
                        </form>
                    </li>
                    <li><a href="#" style="text-decoration: none; color:black; font-size:14px;">로그인</a></li>
                    <li><a href="#" style="text-decoration: none; color:black; font-size:14px;">도움말</a></li>
                    <li><a href="#" style="text-decoration: none; color:black; font-size:14px;">바스켓백 [0]</a></li>
                </ul>
            </div>
        </div>
    </header>
    <!-- 전체 화면 오버레이 메뉴 -->
  <aside id="menuOverlay" class="overlay" aria-hidden="true">
    <div class="overlay__panel">
        <div class="overlay__top"  style="margin-top:20px;">
            <button id="closeBtn" class="overlay__close" aria-label="메뉴 닫기"></button>
            <div style="font-size:72px; font-weight:800; letter-spacing:-10px; "class="title-didone">NICHIYA</div>
        </div>
        <style>
            /* 우측 서브항목 기본은 숨김 + 페이드 트랜지션 준비 */
            .sub {
                opacity: 0;
                transform: translateY(6px);
                pointer-events: none;
                transition: opacity .28s ease, transform .28s ease;
                display: none; /* 시각·레이아웃 모두 숨김 */
            }
            /* 보여줄 때 */
            .sub.show {
                display: block;
                opacity: 1;
                transform: translateY(0);
                pointer-events: auto;
            }
            /* 오른쪽 컬럼은 패널들을 포개는 '스테이지' */
            #subcol{
                grid-row: span 2;
                height:900px;
                position: relative;          /* 자식 absolute 기준점 */
                padding: 0;                  /* 안쪽 여백은 패널에서 */
            }
            /* 접근성: 현재 선택된 카테고리 표시(선택사항) */
            .overlay__menu a[data-cat].is-active { font-weight: 700; text-decoration: underline; }

            /* 오른쪽 컬럼의 항목은 여백 제거(전역 a padding 무시) */
            #subcol .sub{
                padding:0;
                margin:0;
            }
            /* 패널: 전부 겹쳐 놓고 기본은 숨김 */
            #subcol .panel{
                position: absolute; inset: 0;
                padding: 20px;
                overflow: auto;
                opacity: 0;
                transform: translateY(6px);
                transition: opacity .35s ease, transform .35s ease;
                visibility: hidden;   /* display 대신 visibility */
                pointer-events: none; /* 숨길 때 클릭 방지 */
            }

            /* 보이는 패널 */
            #subcol .panel.show{
                opacity: 1;
                transform: none;
                visibility: visible;
                pointer-events: auto; /* 다시 클릭 가능 */
            }

            /* 예시용 그리드(원하면 커스터마이즈) */
            .menu-grid{
                display: grid;
                grid-template-columns: repeat(2, auto);
                column-gap: 50px;   /* 가로 간격 여기서 조절 */
                row-gap: 6px;      /* 세로 간격(필요시) */
                padding: 0;        /* UL 기본 패딩 제거 */
                margin: 0;         /* UL 기본 마진 제거 */
                justify-content: start; /* 왼쪽 정렬 */
            }
            .menu-grid li{ list-style: none; }
            #header{ display: contents; }
        </style>

        <div style="display: flex; margin-left:20%; margin-top:1%; width:100%;">
            <nav class="overlay__menu" style="width:100%;">
                <div style="">
                    <a th:href="@{/cs/notice/list}"><b>공지사항</b></a>
                    <a th:href="@{/cs/faq/list}"><b>자주묻는질문</b></a>
                    <a th:href="@{/cs/qna/list}"><b>Qna</b></a>
                    <br>
                    <a th:href="@{/cs/notice/list}">전체</a>
                    <a th:href="@{/cs/notice/list(boardType='서비스')}">고객서비스</a>
                    <a th:href="@{/cs/notice/list(boardType='안전거래')}">안전거래</a>
                    <a th:href="@{/cs/notice/list(boardType='판매중지')}">위해상품</a>
                    <a th:href="@{/cs/notice/list(boardType='당첨자')}">이벤트당첨</a>
                </div>
            </nav>
        </div>
    </div>
  </aside>

    <script>
    const body     = document.body;
    const menuBtn  = document.getElementById('menuBtn');
    const closeBtn = document.getElementById('closeBtn');
    const overlay  = document.getElementById('menuOverlay');

    function openMenu(){
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
        menuBtn.setAttribute('aria-expanded', 'true');
        body.style.overflow = 'hidden'; // 뒤 스크롤 잠금
    }
    function closeMenu(){
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
        menuBtn.setAttribute('aria-expanded', 'false');
        body.style.overflow = '';
    }

    menuBtn.addEventListener('click', openMenu);
    closeBtn.addEventListener('click', closeMenu);
    overlay.addEventListener('click', (e) => {
        // 빈 배경 클릭 시 닫기 (메뉴 콘텐츠 클릭은 무시)
        if(e.target === overlay) closeMenu();
    });
    // Esc 키로 닫기
    window.addEventListener('keydown', (e)=>{
        if(e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
    });
    // ====== 새로 추가: 카테고리 클릭 시 페이드인 ======
    // 매핑은 data-cat 값과 data-sub 값을 동일 키로 연결
    const catLinks = document.querySelectorAll('.overlay__menu a[data-cat]');
    const panels   = document.querySelectorAll('#subcol .panel');

    function setActiveCat(target){
        catLinks.forEach(a => a.classList.remove('is-active'));
        if(target) target.classList.add('is-active');
    }

    function showPanel(key){
        panels.forEach(p => p.classList.toggle('show', p.dataset.key === key));
    }

    catLinks.forEach(link => {
    link.addEventListener('click', (e) => {
            e.preventDefault();
            const key = link.getAttribute('data-cat');
            setActiveCat(link);
            showPanel(key);
        });
    });

    </script>

<!--    <div class="breadcrumb">-->
<!--        홈 &gt; 고객센터 &gt; 공지사항-->
<!--    </div>-->

    <div id="content" class="cs_notice_view_wrap">
        <h1>NOTICE View</h1>
        <div class="cs_sub_nav">
            <ul>
                <li th:classappend="${boardType == null or boardType == '' or boardType == '전체'} ? 'on'">
                    <a th:href="@{/cs/notice/list}">전체</a>
                </li>
                <li th:classappend="${boardType == '서비스'} ? 'on'">
                    <a th:href="@{/cs/notice/list(boardType='서비스')}">고객서비스</a>
                </li>
                <li th:classappend="${boardType == '안전거래'} ? 'on'">
                    <a th:href="@{/cs/notice/list(boardType='안전거래')}">안전거래</a>
                </li>
                <li th:classappend="${boardType == '판매중지'} ? 'on'">
                    <a th:href="@{/cs/notice/list(boardType='판매중지')}">위해상품</a>
                </li>
                <li th:classappend="${boardType == '당첨자'} ? 'on'">
                    <a th:href="@{/cs/notice/list(boardType='당첨자')}">이벤트당첨</a>
                </li>
            </ul>
        </div>

        <div class="cs_view_content">
            <div class="title_area">
                <h3 th:text="${notice.title}">공지사항 제목</h3>
                <p class="date" th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}">2025.10.10</p>
            </div>

            <div class="view_area" th:utext="${notice.content}" style="border-bottom: 1px solid #ddd"></div>
        </div>

        <div class="btn_area">
            <a th:href="@{/cs/notice/list(boardType=${boardType})}" class="btn_list">목록</a>
        </div>
    </div>
    <div th:replace="~{main/footer :: footer}"></div>

    <script>
        // --- 요소 가져오기 ---
        const body     = document.body;
        const menuBtn  = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');
        const overlay  = document.getElementById('menuOverlay');

        // --- 메뉴 열기 ---
        function openMenu(){
            overlay.classList.add('open');
            overlay.setAttribute('aria-hidden', 'false');
            menuBtn.setAttribute('aria-expanded', 'true');
            body.style.overflow = 'hidden';
        }

        // --- 메뉴 닫기 ---
        function closeMenu(){
            overlay.classList.remove('open');
            overlay.setAttribute('aria-hidden', 'true');
            menuBtn.setAttribute('aria-expanded', 'false');
            body.style.overflow = '';
        }

        // --- 이벤트 연결 ---
        if(menuBtn && closeBtn && overlay){
            menuBtn.addEventListener('click', openMenu);
            closeBtn.addEventListener('click', closeMenu);

            // 배경 클릭 시 닫기
            overlay.addEventListener('click', (e) => {
                if(e.target === overlay) closeMenu();
            });

            // ESC 키 눌렀을 때 닫기
            window.addEventListener('keydown', (e)=>{
                if(e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
            });
        }
    </script>
</body>
</html>
